<div class="register-container">
    <div class="register-card">
        <h2 class="title">Create Account</h2>
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" formControlName="name" placeholder="Enter your name" />
                <small *ngIf="name?.invalid && name?.touched">Name is required</small>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" formControlName="email" placeholder="Enter your email" />
                <small *ngIf="email?.invalid && email?.touched">Enter a valid email</small>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" formControlName="password" placeholder="Enter password" />
                <small *ngIf="password?.errors?.['strongPassword'] && password?.touched">Password must contain:
                    <ul>
                        <li>Min 6 characters</li>
                        <li>1 uppercase</li>
                        <li>1 lowercase</li>
                        <li>1 number</li>
                        <li>1 special character (@,$,!,%,*,?,&)</li>
                    </ul>
                </small>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" formControlName="confirmPassword" placeholder="Confirm Password" />
                <small *ngIf="registerForm.errors?.['passwordMismatch'] && confirmPassword?.touched">Password do not match</small>
            </div>
            <div class="form-group mb-3">
                <label>Role</label>
                
 <select formControlName="role" class="form-control">
    <option value="">Select Role</option>
          <option value="customer">Customer</option>
          <option value="admin">Admin</option>
          <option value="delivery">Delivery Partner</option>
        </select>
<small *ngIf="role?.invalid && role?.touched">Role is required</small>
            </div>

            <button type="submit" class="btn" [disabled]="registerForm.invalid">Register</button>
        </form>
        <div class="footer-text">
            Already have an account?
            <a routerLink="/auth/login">Login</a>
        </div>
    </div>
</div>
