<div class="login-container">
<div class="login-card">
 <h2 class="title">Login</h2>
 @if(errorMessage){
<div class="alert alert-danger">
{{errorMessage}}
</div>
 }
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
   

    <div class="form-group" [class.error]="email?.invalid && email?.touched">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="Enter your email"
      />
      <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
       Email is required
      </small>
    </div>

    <div class="form-group" [class.error]="password?.invalid && email?.touched">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Enter your password"
      />
       <small *ngIf="password?.hasError('required') && password?.touched">
        Password is required
      </small>
      <small *ngIf="password?.hasError('minLength') && password?.touched">
        Password must be at least 6 characters
      </small>
    </div>

    <button type="submit" class="btn"[disabled]="loginForm.invalid">Login</button>
  </form>
  <div class="footer-text">Don't have an account?
    <a routerLink="/auth/register">Register</a>
  </div>
</div>
</div>
