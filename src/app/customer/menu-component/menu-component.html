
<div class="row g-3">
        @for(item of menuItems  | filterMenu:searchTerm; track item.id){
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card  shadow-sm" [ngClass]="{'highlight-card': item.name.toLowerCase().includes(searchTerm)}">
                <img [src]="item.image" class="card-img-top" alt="{{item.name}}">
                <div class="card-body d-flex flex-column justify-content-between">
                          <h5 [innerHTML]="item.name | highlight:searchTerm"></h5>
                    <p class="text-muted mb-2">{{item.veg ?'Veg' :'Non-Veg'}}</p>
                    <p class="fw-bold mb-3 text-primary"><i class="bi bi-currency-rupee"></i>{{item.price}}</p>
                    
                    <button class="btn btn-outline-primary mt-auto" (click)="addToCart(item)">Add to Cart</button>
                </div>
            </div>
        </div>
        }
    </div>
