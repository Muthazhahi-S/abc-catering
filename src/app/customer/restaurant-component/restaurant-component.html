

<div class="container py-3">
  <div class="row g-3">
    @for (res of restaurants| filterMenu:searchTerm; track res.id) {
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="card h-100" [ngClass]="{'highlight-card':searchTerm && res.name.toLowerCase().includes(searchTerm)}">
          <img [src]="res.image" class="card-img-top" alt="{{ res.name }}">
          <div class="card-body d-flex flex-column">
 <h5 [innerHTML]="res.name | highlight:searchTerm"></h5>
            <p class="mb-1 small text-muted">{{ res.cuisine }} <i class="bi bi-clock"></i> {{ res.deliveryTime }} mins</p>
            <p class="mb-2">Rating:
               @for (star of getStars(res.rating); track $index) {
               <ng-container>
    <i [class]="star.icon + ' ' + star.color"></i>
  </ng-container>
}
  {{ res.rating }} </p>
            <a [routerLink]="['/customer/menu', res.id]" class="mt-auto btn btn-primary">View Menu</a>
          </div>
        </div>
      </div>
    }
  </div>
</div>
